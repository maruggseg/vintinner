# Configuración de Fly.io para alojar un "self-hosted runner" de GitHub
# Actions en la UE (región de París). Así el scraping de Vinted sale
# desde una IP europea en vez de la IP (normalmente de EE.UU./UK) de los
# runners normales de GitHub ("ubuntu-latest").
#
# Nota: Fly.io dejó de admitir la región de Madrid ("mad" está
# deprecada, no se pueden crear recursos nuevos ahí). Usamos París
# ("cdg") en su lugar — vale cualquier país de la UE para este caso.
#
# Usa una imagen ya hecha (myoung34/github-runner) que se encarga de
# registrar el runner en el repo automáticamente al arrancar, usando el
# token que se pasa como "secret" (nunca va en este archivo ni en el repo).
#
# Despliegue (desde esta carpeta, con flyctl instalado y sesión iniciada):
#   fly launch --no-deploy --copy-config --name vintinner-runner
#   fly secrets set ACCESS_TOKEN=xxxxx   (el PAT, se pide en la terminal, nunca se pega en el chat)
#   fly deploy --primary-region cdg

app = "vintinner-runner"
primary_region = "cdg"

[build]
  image = "myoung34/github-runner:latest"

[env]
  REPO_URL = "https://github.com/maruggseg/vintinner"
  RUNNER_SCOPE = "repo"
  RUNNER_NAME = "fly-eu"
  RUNNER_WORKDIR = "/tmp/runner"
  LABELS = "self-hosted,eu"
  DISABLE_AUTO_UPDATE = "true"
  # Importante: NO poner aquí la variable EPHEMERAL, ni siquiera a "false".
  # Esta imagen trata la simple PRESENCIA de la variable como "activar modo
  # efímero" (da igual el valor) — el runner hacía un trabajo y se
  # autodestruía. Hay que dejarla completamente ausente.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
