name: Diagnóstico estructura item Vinted

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Volcar JSON crudo del primer anuncio
        run: |
          python3 -c "
          import json
          from vinted_api import crear_sesion_autenticada, buscar_por_categoria

          sesion = crear_sesion_autenticada()
          if sesion is None:
              print('No se pudo crear sesión')
              raise SystemExit(1)

          items = buscar_por_categoria(sesion, '2632', pagina=1, por_pagina=3, precio_desde=60)
          print('Items recibidos:', len(items))
          if items:
              print(json.dumps(items[0], indent=2, ensure_ascii=False))
          "
