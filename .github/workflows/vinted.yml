name: Vinted Bot

on:
  schedule:
    # Horas en UTC. España en verano = UTC+2, en invierno = UTC+1.
    # Escaneos: cada 20 minutos
    - cron: "*/20 * * * *"
    # Resumen diario: 19:00 UTC (~21:00 en España en verano)
    - cron: "0 19 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde GitHub para probar

permissions:
  contents: write   # necesario para que el workflow pueda guardar historial.csv y el offset

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear Vinted
        if: github.event.schedule == '*/20 * * * *' || github.event_name == 'workflow_dispatch'
        run: python escanear.py

      - name: Generar datos para la web
        run: python generar_web.py

      - name: Enviar resumen diario
        if: github.event.schedule == '0 19 * * *'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas.py

      - name: Guardar cambios (historial y offset)
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add data/historial.csv site/data.json
          git commit -m "Actualizar datos" || echo "Sin cambios que guardar"
          git pull --rebase origin main
          git push
