name: Vinted Bot

on:
  schedule:
    # Horas en UTC. España en verano = UTC+2, en invierno = UTC+1.
    # Escaneos: cada 10 minutos
    - cron: "*/10 * * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde GitHub para probar

permissions:
  contents: write   # necesario para que el workflow pueda guardar historial.csv y el offset

# Evita que dos ejecuciones corran a la vez. Si el disparador externo (cada
# 10 min) llega mientras la anterior sigue en cola/corriendo, esta espera
# en vez de solaparse — antes chocaban al hacer "git push" ("cannot lock
# ref") porque GitHub a veces tarda varios minutos en arrancar una
# ejecución, y para entonces ya había llegado la siguiente.
concurrency:
  group: vinted-bot-main
  cancel-in-progress: false

jobs:
  run:
    # Runner auto-alojado en Fly.io (región de la UE, París), para que las
    # peticiones a Vinted salgan con IP europea en vez de la IP de los
    # runners normales de GitHub (que daba resultados de UK/USA).
    runs-on: [self-hosted, eu]
    steps:
      - uses: actions/checkout@v4

      # En este runner (self-hosted en Fly.io) usamos el Python que ya
      # trae la imagen en vez de actions/setup-python: esa acción se
      # quedaba colgada varios minutos descargando/instalando una build
      # de Python, probablemente por los recursos limitados de la
      # máquina (512 MB RAM, shared-cpu-1x).
      # Los datos (historial.csv, perfiles) viven en la rama "datos", no en
      # main: Vercel cuenta como despliegue cada commit a main (aunque lo
      # cancele) y el plan gratis permite 100 al día; con un commit cada
      # 10 min se agotaba el cupo y los cambios de la web no se publicaban.
      # Vercel tiene desactivada la rama "datos" (vercel.json).
      - name: Traer datos (rama datos)
        run: |
          D="$RUNNER_TEMP/datos"
          rm -rf "$D"; git worktree prune
          if git fetch --depth=1 origin datos; then
            git worktree add --detach "$D" FETCH_HEAD
          else
            # Primera vez: crear la rama con los datos que había en main.
            git worktree add --detach "$D" HEAD
            (
              cd "$D"
              git checkout -q --orphan datos-nueva
              git rm -rq --cached .
              find . -mindepth 1 -maxdepth 1 ! -name .git ! -name data -exec rm -rf {} +
            )
          fi
          cp -f "$D"/data/* data/ 2>/dev/null || true

      - name: Instalar dependencias
        run: python3 -m pip install --user -r requirements.txt

      - name: Escanear Vinted
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: python3 escanear.py

      # Perfiles que sigues (data/perfiles.txt). Si falla, no rompe el
      # escaneo normal: se guarda igual lo demás.
      - name: Seguir perfiles
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 seguir_perfiles.py

      - name: Guardar datos (rama datos)
        run: |
          D="$RUNNER_TEMP/datos"
          mkdir -p "$D/data"
          cp -f data/historial.csv "$D/data/"
          cp -f data/perfiles.json "$D/data/" 2>/dev/null || true
          cd "$D"
          # Vercel lee la configuración de la rama que despliega: sin esto
          # intentaba desplegar "datos" (que no tiene la web) y fallaba.
          printf '%s\n' '{' '  "git": { "deploymentEnabled": false },' '  "ignoreCommand": "exit 0"' '}' > vercel.json
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add data vercel.json
          git commit -q -m "Actualizar datos" || echo "Sin cambios que guardar"
          for intento in 1 2 3 4 5; do
            git push origin HEAD:datos && break
            echo "Push falló (intento $intento), reintentando..."
            git pull --rebase --depth=1 origin datos || true
            sleep $((intento * 3))
          done
